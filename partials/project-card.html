<article class="project-card">
    <a href="/{{idioma}}/proyectos/{{proyecto.id}}/" class="project-card__link">
  
      <div class="project-card__imagen">
        <img src="{{proyecto.imagen}}" alt="{{proyecto.titulo}}" loading="lazy">
      </div>
  
      <div class="project-card__body">
        <h3 class="project-card__titulo">{{proyecto.titulo}}</h3>
        <p class="project-card__resumen">{{proyecto.resumen}}</p>
  
        <ul class="project-card__tech">
          {{lista_tecnologias}}
        </ul>
  
        <span class="project-card__estado">{{proyecto.estado}}</span>
      </div>
  
    </a>
  </article>
