<article class="charla-card">
    <a href="/{{idioma}}/charlas/{{charla.id}}/" class="charla-card__link">
  
      <span class="charla-card__fecha">{{charla.fecha_formateada}}</span>
      <h3 class="charla-card__titulo">{{charla.titulo}}</h3>
      <p class="charla-card__rol">{{charla.rol}} · {{charla.lugar}}</p>
      <p class="charla-card__resumen">{{charla.resumen}}</p>
  
    </a>
  </article>
