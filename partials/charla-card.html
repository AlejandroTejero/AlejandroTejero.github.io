<article class="charla-card reveal">
  <a href="/{{idioma}}/trayectoria/charlas/{{charla.id}}/" class="charla-card__link">
    <span class="charla-card__fecha">{{charla.fecha_formateada}}</span>
    <h3 class="charla-card__titulo">{{charla.titulo}}</h3>
    <p class="charla-card__rol">{{charla.rol}}</p>
    {{lugar_si_existe}}
    <p class="charla-card__resumen">{{charla.resumen}}</p>
    <span class="charla-card__flecha" aria-hidden="true">→</span>
  </a>
</article>
