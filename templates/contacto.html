<section class="pagina-header pagina-header--centrado">
    <h1>{{i18n.contacto_titulo}}</h1>
    <p>{{i18n.contacto_intro}}</p>
  </section>
  
  <section class="contacto-grid">
  
    <div class="contacto-tarjeta">
      <span class="contacto-tarjeta__icono">✉</span>
      <h3>Email</h3>
      <a href="mailto:{{site.contacto.email}}">{{site.contacto.email}}</a>
    </div>
  
    <div class="contacto-tarjeta">
      <span class="contacto-tarjeta__icono">☎</span>
      <h3>{{i18n.telefono}}</h3>
      <a href="tel:{{site.contacto.telefono_href}}">{{site.contacto.telefono}}</a>
    </div>
  
    <div class="contacto-tarjeta">
      <span class="contacto-tarjeta__icono">in</span>
      <h3>LinkedIn</h3>
      <a href="{{site.contacto.linkedin}}" target="_blank" rel="noopener">{{i18n.ver_perfil}}</a>
    </div>
  
    <div class="contacto-tarjeta">
      <span class="contacto-tarjeta__icono">{ }</span>
      <h3>GitHub</h3>
      <a href="{{site.contacto.github}}" target="_blank" rel="noopener">{{i18n.ver_perfil}}</a>
    </div>
  
  </section>
  
  <section class="contacto-ubicacion">
    <p>{{site.ubicacion}}</p>
  </section>
